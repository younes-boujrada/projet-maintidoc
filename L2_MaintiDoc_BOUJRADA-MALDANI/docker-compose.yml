version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: maintidoc
      POSTGRES_USER: maintidoc
      POSTGRES_PASSWORD: maintidoc
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: maintidoc
      MINIO_ROOT_PASSWORD: maintidoc123
    volumes: ["./data/minio:/data"]
